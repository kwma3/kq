<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(30,100%,50%)">
        <animate attributeName="stop-color" values="hsl(30,100%,50%);hsl(210,100%,50%);hsl(120,100%,50%);hsl(30,100%,50%)" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:hsl(210,100%,50%)">
        <animate attributeName="stop-color" values="hsl(210,100%,50%);hsl(120,100%,50%);hsl(30,100%,50%);hsl(210,100%,50%)" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:hsl(120,100%,50%)">
        <animate attributeName="stop-color" values="hsl(120,100%,50%);hsl(30,100%,50%);hsl(210,100%,50%);hsl(120,100%,50%)" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <style>
    .fat-line {
      fill: none;
      stroke: url(#rainbow);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <circle cx="50" cy="50" r="40" class="fat-line"/>
  <path d="M30 30 L30 70 M30 50 L48 32 M30 50 L48 68" class="fat-line"/>
  <line x1="70" y1="72" x2="88" y2="95" class="fat-line"/>
</svg>